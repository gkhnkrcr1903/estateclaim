<!-- Eski GitHub Pages adresi (…github.io/estateclaim/…) yeni adrese, aynı yol ve parametrelerle yönlendirilir. -->
<script>

    var yeni = "https://evarsaanaliz.pages.dev";
    var yol = location.pathname.replace(/^\/estateclaim/, "") || "/";
    location.replace(yeni + yol + location.search + location.hash);
  })();
</script>
