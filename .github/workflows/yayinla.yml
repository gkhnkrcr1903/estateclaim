name: Veri güncelle

# Uygulama Cloudflare Pages'te yayınlanır (evarsaanaliz.pages.dev): her push'ta Cloudflare kendisi derler.
# Bu iş akışı yalnızca:
#  1) her ayın 20'si (veya elle) TCMB konut verisini günceller ve commit'ler — commit, Cloudflare'de yeni yayını tetikler;
#  2) eski GitHub Pages adresinde (…github.io/estateclaim/…) yeni adrese yönlendiren sayfayı yayınlar.

on:
  schedule:
    - cron: "0 6 20 * *" # her ayın 20'si: TCMB verisini yenile
  workflow_dispatch: # GitHub > Actions > Veri güncelle > Run workflow ile elle güncelleme
  push:
    branches: [main]
    paths: ["yonlendirme/**", ".github/workflows/yayinla.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: veri-guncelle
  cancel-in-progress: false

jobs:
  tcmb:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TCMB verisini güncelle
        run: node scripts/tcmb-guncelle.mjs
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
      - name: Güncellenen kaynak veriyi kaydet (Cloudflare yeni yayını başlatır)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/kaynak
          git diff --cached --quiet || (git commit -m "TCMB verisi güncellendi" && git push)

  yonlendirme:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: yonlendirme
      - id: deployment
        uses: actions/deploy-pages@v4
