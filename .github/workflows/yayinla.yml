name: Yayınla

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 20 * *" # her ayın 20'si: TCMB verisini yenile
  workflow_dispatch: # GitHub > Actions > Yayınla > Run workflow ile elle güncelleme

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TCMB verisini güncelle
        run: node scripts/tcmb-guncelle.mjs
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
      - name: Güncellenen kaynak veriyi kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/kaynak
          git diff --cached --quiet || (git commit -m "TCMB verisi güncellendi" && git push)
      - name: Veriyi oluştur ve şifrele
        run: npm run veri
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
      - name: Derle
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
